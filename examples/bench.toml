database = "../data/bench.sqlite3"
regions = ["JP", "HK", "SG", "US"]

[[providers]]
name = "taishan"
source_env = "TAISHAN_SUB_URL"
# Some providers return a Base64 URI list to Mihomo's UA but native YAML here.
user_agent = "clash.meta"

[[providers]]
name = "cokecloud"
source_env = "COKECLOUD_SUB_URL"

# Local YAML is also supported; use exactly one of path/source_env per provider.
# [[providers]]
# name = "local-snapshot"
# path = "./private/local.yaml"

[engine]
adapter = "faceair"
binary = "../tools/bin/clash-speedtest"
speed_mode = "download"
# ChatGPT-first screening only needs a small, repeatable transfer; 5 MB avoids
# multiplying traffic too aggressively across every node.
server_url = "https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg"
download_size_mb = 5
upload_size_mb = 10
# `--two-stage` uses these larger transfers only for nodes that pass all
# ChatGPT checks in stage 1.
two_stage_download_size_mb = 50
two_stage_upload_size_mb = 20
timeout_seconds = 15
process_timeout_seconds = 3600
concurrent = 2
progress_interval_seconds = 5
user_agent = "clash.meta"

[enrichment]
# Starts a separate, isolated Mihomo process for each provider and selects every
# node through the official REST API. Enable for egress IP/country/ASN.
enabled = true
mihomo_binary = "../tools/bin/mihomo"
timeout_seconds = 15
# Each worker owns a separate Mihomo process, so selectors and proxy sessions do
# not leak across nodes. Four workers make the HTTP-only enrichment phase much faster.
workers = 4
# ChatGPT is the primary goal. Skip YouTube/Netflix to reduce per-node runtime.
unlock = true
checks = ["chatgpt"]
# Current OpenAI availability policy does not list these nearby exit regions.
# The actual exit country (not the node name) is checked against this list.
chatgpt_unsupported_countries = ["CN", "HK", "MO"]

[report]
output = "../reports"
days = 7
timezone = "Asia/Shanghai"

[notification]
# Send a native macOS notification after every scheduled or manual real run.
enabled = true
mode = "macos"

# Override/add classification rules if your provider uses unusual names.
# [region_patterns]
# JP = ["(?i)日本|东京|JP"]
